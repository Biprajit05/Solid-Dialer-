name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "project.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q project.zip -d app_src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: app_src
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app_src/app/build/outputs/apk/debug/app-debug.apk ClearDialer.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Clear Dialer build ${{ github.run_number }}
          files: ClearDialer.apk
